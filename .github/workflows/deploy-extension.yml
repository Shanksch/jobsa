name: Deploy Web Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'extension-v*' # Trigger when you push a tag like extension-v1.0.0

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Extension
        run: npm run build
        working-directory: ./apps/extension

      - name: Zip Extension
        run: |
          cd apps/extension/dist
          zip -r ../../../extension.zip .
          echo "Created extension.zip"

      # -------------------------------------------------------------
      # Chrome Web Store Upload
      # Requires you to set up API keys in Google Cloud Console
      # and add them to your GitHub Repository Secrets.
      # -------------------------------------------------------------
      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      # -------------------------------------------------------------
      # Create a GitHub Release so you can download the zip directly
      # -------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: extension.zip
          generate_release_notes: true
