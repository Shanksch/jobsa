<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSA — Autofill</title>
  <script>
    chrome.storage.local.get(['jobsa_theme'], function(result) {
      if (result.jobsa_theme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    });
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f5; /* zinc-100 */
      color: #18181b; /* zinc-900 */
      padding: 20px;
    }

    html.dark body {
      background: #0f1117;
      color: #e4e4e7;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #09090b; /* zinc-950 */
      letter-spacing: -0.01em;
    }

    html.dark .header h1 {
      color: #f4f4f5;
    }

    .divider {
      height: 1px;
      background: #e4e4e7; /* zinc-200 */
      margin-bottom: 16px;
    }

    html.dark .divider {
      background: #27272a;
    }

    .description {
      font-size: 12px;
      color: #52525b; /* zinc-600 */
      line-height: 1.5;
      margin-bottom: 16px;
    }

    html.dark .description {
      color: #a1a1aa;
    }

    #autofill-btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.01em;
    }

    #autofill-btn:hover {
      background: linear-gradient(135deg, #16a34a, #15803d);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    #autofill-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    #autofill-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #status {
      margin-top: 12px;
      font-size: 11px;
      color: #52525b;
      text-align: center;
      min-height: 16px;
      transition: color 0.2s ease;
    }

    html.dark #status {
      color: #a1a1aa;
    }

    #status.success {
      color: #22c55e;
    }

    #status.error {
      color: #ef4444;
    }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e4e4e7; /* zinc-200 */
      text-align: center;
    }

    html.dark .footer {
      border-top: 1px solid #27272a;
    }

    .footer a {
      font-size: 11px;
      color: #71717a;
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover {
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="JobSA">
    <h1>JobSA Autofill</h1>
  </div>

  <div class="divider"></div>

  <p class="description">
    Click the button below to inject the autofill helper into the current page.
    This uses your active-tab permission — no extra access needed.
  </p>

  <button id="autofill-btn">Autofill this page</button>

  <p id="status"></p>

  <div class="footer">
    <a id="open-options">Extension settings →</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
