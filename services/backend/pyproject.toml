[project]
name = "jobsa-backend"
version = "0.1.0"
description = "JobSA Backend — FastAPI service for the AI Job Application Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.0.0",
    "httpx>=0.28.0",
    # Supabase ecosystem
    "supabase>=2.10.0",
    # LLM (unified API — supports Groq, OpenAI, Ollama, etc.)
    "litellm>=1.50.0",
    "instructor>=1.3.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "langfuse>=2.0.0",
    "google-genai>=0.2.2",
    "tenacity>=8.5.0",
    # Fuzzy string matching (dedup on resume import)
    "rapidfuzz>=3.10.0",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "B008", "B904", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]