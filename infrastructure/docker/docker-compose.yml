# ─── Docker Compose — JobSA Development Environment ─────────
#
# PRIMARY: Use Supabase cloud (supabase.com) — zero Docker needed.
#          Just set DATABASE_URL in .env pointing to your Supabase project.
#
# FALLBACK: Use this docker-compose for fully local dev (no cloud accounts).
#           Start: docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# The simplified architecture only needs PostgreSQL locally.
# Redis, Qdrant, and Ollama have been replaced by:
#   - Supabase (DB + pgvector + Storage + Auth)
#   - Groq free-tier API (LLM)

services:
  # ─── PostgreSQL 16 (local dev fallback) ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobsa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobsa
      POSTGRES_PASSWORD: jobsa_dev
      POSTGRES_DB: jobsa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: jobsa-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobsa:jobsa_dev@postgres:5432/jobsa
      DATABASE_URL_SYNC: postgresql://jobsa:jobsa_dev@postgres:5432/jobsa
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full  # Only start with: docker compose --profile full up

volumes:
  pgdata:
