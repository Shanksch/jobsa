# ─── Docker Compose — JobSA Development Environment ─────────
# Start everything: docker compose -f infrastructure/docker/docker-compose.yml up -d

services:
  # ─── PostgreSQL 16 ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobsa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobsa
      POSTGRES_PASSWORD: jobsa_dev
      POSTGRES_DB: jobsa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jobsa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Qdrant (Vector DB) ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jobsa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ─── Ollama (Local LLM) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jobsa-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for GPU passthrough (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: jobsa-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobsa:jobsa_dev@postgres:5432/jobsa
      DATABASE_URL_SYNC: postgresql://jobsa:jobsa_dev@postgres:5432/jobsa
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://ollama:11434
      EMBEDDING_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full  # Only start with: docker compose --profile full up

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollama_data:
